<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForVision Optika – Tržby</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#708096;--line:#e3eaf2;--accent:#2457d6;--danger:#b91c1c;--soft:#eef4ff}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:34px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:25px;margin:0;letter-spacing:-.4px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px rgba(30,55,90,.06)}
.login{max-width:380px;margin:12vh auto 0}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,button{font:inherit} input{width:100%;padding:12px 13px;border:1px solid #d7e0ea;border-radius:12px;background:#fbfdff;color:var(--text);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.10)}
button{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:600}.primary{background:var(--accent);color:white}.ghost{background:#eef2f7;color:var(--text)}.danger{background:#fee2e2;color:var(--danger)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.total{font-size:29px;font-weight:750;margin-top:3px;letter-spacing:-.5px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:var(--soft);border-radius:15px;padding:14px}.stat .label{font-size:12px;color:var(--muted);margin-bottom:5px}.stat .value{font-size:18px;font-weight:700}.commission{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.commission-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.commission-title{font-weight:700}.positive{color:#166534}.over{color:#b91c1c}.search{max-width:280px}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}.hide{display:none!important}.msg{margin-top:10px;font-size:13px}.error{color:#b91c1c}.ok{color:#166534}
@media(max-width:650px){.row{grid-template-columns:1fr 1fr}.summary-grid,.commission-grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.wrap{padding:16px 10px}.card{padding:14px}.total{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card login">
    <h1>ForVision Optika</h1>
    <p class="muted">Evidence měsíčních tržeb</p>
    <div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <div class="actions" style="margin-top:12px"><button id="loginBtn" class="primary">Přihlásit</button></div>
    <div id="loginMsg" class="msg"></div>
  </section>

  <main id="app" class="hide">
    <div class="top">
      <div><h1>ForVision Optika – Tržby</h1><div id="role" class="muted"></div></div>
      <button id="logoutBtn" class="ghost">Odhlásit</button>
    </div>

    <section class="card">
      <div class="row">
        <div class="field"><label for="month">Měsíc</label><input id="month" type="month"></div>
        <div class="field"><label for="qr">QR</label><input id="qr" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label for="card">Karta</label><input id="card" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label for="cash">Hotovost</label><input id="cash" type="number" min="0" step="1" value="0"></div>
      </div>
      <div class="summary-grid">
        <div class="stat"><div class="label">QR</div><div id="sumQr" class="value">0 Kč</div></div>
        <div class="stat"><div class="label">Karta</div><div id="sumCard" class="value">0 Kč</div></div>
        <div class="stat"><div class="label">Hotovost</div><div id="sumCash" class="value">0 Kč</div></div>
        <div class="stat"><div class="label">Celkem</div><div id="total" class="value">0 Kč</div></div>
      </div>
      <div class="commission">
        <div class="commission-title">Provize</div>
        <div class="muted">3 % z měsíční tržby + DPP hodiny × 300 Kč</div>
        <div class="field" style="max-width:220px;margin-top:12px">
          <label for="hours">DPP hodiny</label>
          <input id="hours" type="number" min="0" step="0.5" value="24">
        </div>
        <div class="commission-grid">
          <div class="stat"><div class="label">3% provize</div><div id="commission" class="value">0 Kč</div></div>
          <div class="stat"><div class="label">Hodiny × 300</div><div id="hourPay" class="value">0 Kč</div></div>
          <div class="stat"><div class="label">Do 11 990 Kč</div><div id="underLimit" class="value positive">0 Kč</div></div>
          <div class="stat"><div class="label">Nad limit</div><div id="overLimit" class="value over">0 Kč</div></div>
        </div>
      </div>
      <div class="actions" style="margin-top:14px">
        <button id="saveBtn" class="primary">Uložit</button>
        <button id="cancelBtn" class="ghost hide">Zrušit úpravu</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </section>

    <section class="card">
      <div class="top" style="margin-bottom:8px">
        <strong>Historie</strong>
        <input id="search" class="search" placeholder="Hledat měsíc…">
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Měsíc</th><th>QR</th><th>Karta</th><th>Hotovost</th><th>Celkem</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="tableMsg" class="msg"></div>
    </section>
  </main>
</div>
<script>
const DB_URL = "https://forvision-oftabal.aws-eu-west-1.turso.io";
const AUTH = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODY2ODk5ODQsImlkIjoiMDE5ZmZlZjMtNTcwMS03ZWVkLTgxNzMtNjY5NDQ4ODJlZDNkIiwia2lkIjoicm1mdG01TUZZNllRTGs4QXR1TGRnQzRENGlmTDFidFhnSWxlSXF0OU9xZyIsInJpZCI6ImUwODJlZWY1LTVkZDAtNDhhYi1hMDQxLWMxOGU0NWY4N2IzNSJ9.PejDY9gy9YD7DpvD7Xck6tbYTP4SFUYMO3ztnw1nUN31lhkOVi22Js97bhSAbejiNJI7aRa85YTzr0zPcvEOAQ";
let role=null, data=[], editing=null;
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('cs-CZ').format(Number(n)||0)+' Kč';
const monthLabel=s=>{const [y,m]=s.split('-');return `${m}/${y}`};

async function sql(statement,args=[]){
  const r=await fetch(DB_URL+'/v2/pipeline',{
    method:'POST',
    headers:{'Authorization':'Bearer '+AUTH,'Content-Type':'application/json'},
    body:JSON.stringify({requests:[{type:'execute',stmt:{sql:statement,args:args.map(v=>({type:Number.isInteger(v)?'integer':'text',value:String(v)}))}},{type:'close'}]})
  });
  if(!r.ok) throw new Error('Databáze: '+r.status);
  const j=await r.json();
  const res=j.results?.[0];
  if(res?.type==='error') throw new Error(res.error?.message||'Chyba databáze');
  return res?.response?.result;
}
async function load(){
  try{
    let r;
    try{r=await sql('SELECT mesic, qr, karta, hotovost, dpp_hodiny FROM optika_trzby ORDER BY mesic DESC')}
    catch(_){await sql('ALTER TABLE optika_trzby ADD COLUMN dpp_hodiny REAL NOT NULL DEFAULT 0');r=await sql('SELECT mesic, qr, karta, hotovost, dpp_hodiny FROM optika_trzby ORDER BY mesic DESC')}
    const cols=r.cols.map(c=>c.name);
    data=(r.rows||[]).map(row=>Object.fromEntries(row.map((v,i)=>[cols[i],v.value])));
    render();
  }catch(e){$('tableMsg').textContent=e.message;$('tableMsg').className='msg error'}
}
function calc(){
  const qr=+$('qr').value||0, card=+$('card').value||0, cash=+$('cash').value||0, hours=+$('hours').value||0;
  const total=qr+card+cash, commission=Math.round(total*.03), hourPay=Math.round(hours*300), dpp=commission+hourPay;
  $('sumQr').textContent=money(qr);$('sumCard').textContent=money(card);$('sumCash').textContent=money(cash);
  $('total').textContent=money(total);$('commission').textContent=money(commission);$('hourPay').textContent=money(hourPay);
  $('underLimit').textContent=money(Math.min(dpp,11990));$('overLimit').textContent=money(Math.max(dpp-11990,0));
}
function reset(){
  editing=null;$('month').disabled=false;
  $('month').value=new Date().toISOString().slice(0,7);
  $('qr').value=$('card').value=$('cash').value=0;$('hours').value=24;
  $('cancelBtn').classList.add('hide');$('saveBtn').textContent='Uložit';$('formMsg').textContent='';calc();
}
function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=data.filter(x=>!q||x.mesic.includes(q)||monthLabel(x.mesic).includes(q));
  $('rows').innerHTML='';
  for(const x of list){
    const tr=document.createElement('tr');
    const total=+x.qr + +x.karta + +x.hotovost;
    tr.innerHTML=`<td>${monthLabel(x.mesic)}</td><td>${money(x.qr)}</td><td>${money(x.karta)}</td><td>${money(x.hotovost)}</td><td><strong>${money(total)}</strong></td><td><div class="actions"><button class="ghost edit">Upravit</button>${role==='admin'?'<button class="danger del">Smazat</button>':''}</div></td>`;
    tr.querySelector('.edit').addEventListener('click',()=>edit(x));
    tr.querySelector('.del')?.addEventListener('click',()=>remove(x.mesic));
    $('rows').appendChild(tr);
  }
  if(!list.length)$('rows').innerHTML='<tr><td colspan="6" class="muted">Žádné záznamy</td></tr>';
}
function edit(x){
  editing=x.mesic;$('month').value=x.mesic;$('month').disabled=true;
  $('qr').value=x.qr;$('card').value=x.karta;$('cash').value=x.hotovost;$('hours').value=x.dpp_hodiny||0;
  $('saveBtn').textContent='Uložit změny';$('cancelBtn').classList.remove('hide');calc();scrollTo({top:0,behavior:'smooth'});
}
async function save(){
  const m=$('month').value, qr=Math.round(+$('qr').value||0), card=Math.round(+$('card').value||0), cash=Math.round(+$('cash').value||0), hours=+$('hours').value||0;
  if(!m){$('formMsg').textContent='Vyber měsíc.';$('formMsg').className='msg error';return}
  try{
    $('saveBtn').disabled=true;
    await sql(`INSERT INTO optika_trzby (mesic,qr,karta,hotovost,dpp_hodiny,updated_at) VALUES (?,?,?,?,?,CURRENT_TIMESTAMP)
      ON CONFLICT(mesic) DO UPDATE SET qr=excluded.qr,karta=excluded.karta,hotovost=excluded.hotovost,dpp_hodiny=excluded.dpp_hodiny,updated_at=CURRENT_TIMESTAMP`,[m,qr,card,cash,hours]);
    reset();await load();$('formMsg').textContent='Uloženo.';$('formMsg').className='msg ok';
  }catch(e){$('formMsg').textContent=e.message;$('formMsg').className='msg error'}finally{$('saveBtn').disabled=false}
}
async function remove(m){
  if(role!=='admin'||!confirm('Opravdu smazat '+monthLabel(m)+'?'))return;
  try{await sql('DELETE FROM optika_trzby WHERE mesic=?',[m]);await load()}catch(e){alert(e.message)}
}
function login(){
  const p=$('pin').value;
  if(p==='1234')role='zdenka'; else if(p==='1815')role='admin'; else{
    $('loginMsg').textContent='Nesprávný PIN.';$('loginMsg').className='msg error';return;
  }
  $('login').classList.add('hide');$('app').classList.remove('hide');
  $('role').textContent=role==='admin'?'Admin':'Zdeňka';reset();load();
}
$('loginBtn').addEventListener('click',login);
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logoutBtn').addEventListener('click',()=>location.reload());
$('saveBtn').addEventListener('click',save);
$('cancelBtn').addEventListener('click',reset);
$('search').addEventListener('input',render);
['qr','card','cash','hours'].forEach(id=>$(id).addEventListener('input',calc));
</script>
</body></html>
