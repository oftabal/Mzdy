<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docházka – OFTABAL</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:700px;margin:35px auto;padding:0 18px;color:#222}
h1{font-size:25px;margin-bottom:8px} .muted{color:#777;font-size:13px}
.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:18px 0}
h2{font-size:19px;margin:0 0 10px} .regular{font-weight:700}
ul{padding-left:22px;margin-bottom:0} li{margin:7px 0}
select{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:9px}
.ok{color:#18743b} .err{color:#a21b1b}
</style>
</head>
<body>
<h1>Docházka zaměstnanců</h1>
<div class="muted">OFTABAL s.r.o. · pouze jednoduchý přehled pro účetní</div>
<p><label>Měsíc: <select id="month"></select></label></p>
<div id="status" class="muted">Načítám aktuální data…</div>
<div id="content"></div>

<script>
const TURSO_URL='https://oftabal-oftabal.aws-eu-west-1.turso.io/v2/pipeline';
const TURSO_TOKEN='eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODU5NTk2NDMsImlkIjoiMDE5ZmQzNzgtYWIwMS03Mjk1LTkxM2YtNjNkODM3ZTQxMzg1Iiwia2lkIjoicm1mdG01TUZZNllRTGs4QXR1TGRnQzRENGlmTDFidFhnSWxlSXF0OU9xZyIsInJpZCI6IjE5ZDNmYjU0LTBkMzUtNGQyOS04MmVhLTJhYzc1MjJiMzZmYyJ9.PdfZDrUyjYJRQNXcLKuloe1puhinzU7rc_hn8bXN8zxozb0t-gGPkKTQkW_6AoUZ9Afa-4qwuSp2Rdd4uvbvCA';
const CLOUD_APP='hr';
const CLOUD_KEY='oftabal-hr-build004';
const TYPES={dovolena:'Dovolená',nemoc:'Nemoc',lekar:'Lékař',skoleni:'Školení',neplacene:'Neplacené volno'};
let DB=null;

function val(x){ return x && typeof x==='object' && 'value' in x ? x.value : x; }
async function query(sql,args=[]){
 const r=await fetch(TURSO_URL,{method:'POST',headers:{Authorization:'Bearer '+TURSO_TOKEN,'Content-Type':'application/json'},
 body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args:args.map(v=>({type:'text',value:String(v)}))}},{type:'close'}]})});
 const j=await r.json(); if(!r.ok) throw new Error('HTTP '+r.status);
 return j.results?.[0]?.response?.result;
}
async function load(){
 const res=await query('SELECT json,updated_at FROM app_data WHERE app=? AND key=?',[CLOUD_APP,CLOUD_KEY]);
 const row=res?.rows?.[0]; if(!row) throw new Error('Data nenalezena');
 DB=JSON.parse(val(row[0]));
 buildMonths(); render();
 document.getElementById('status').textContent='✓ Načteno z aktuálních HR dat';
 document.getElementById('status').className='muted ok';
}
function buildMonths(){
 const set=new Set();
 Object.values(DB.months||{}).forEach(ms=>Object.keys(ms||{}).forEach(m=>set.add(m)));
 const now=new Date(), cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'); set.add(cur);
 const sel=document.getElementById('month');
 [...set].sort().reverse().forEach(m=>{const o=document.createElement('option');o.value=m;
 const [y,mo]=m.split('-');o.textContent=new Date(+y,+mo-1,1).toLocaleDateString('cs-CZ',{month:'long',year:'numeric'});sel.appendChild(o);});
 sel.value=set.has(cur)?cur:[...set].sort().reverse()[0]; sel.onchange=render;
}
function exceptions(id,m){
 const days=DB.months?.[id]?.[m]?.days||{};
 return Object.entries(days).filter(([d,x])=>x && x.type && x.type!=='prace').sort((a,b)=>a[0].localeCompare(b[0]));
}
function person(id,title,regular,m){
 const ex=exceptions(id,m);
 return `<section class="card"><h2>${title}</h2><div>Pravidelné směny: <span class="regular">${regular}</span></div>
 <div class="muted" style="margin-top:13px">Výjimky v tomto měsíci:</div>
 ${ex.length?'<ul>'+ex.map(([d,x])=>`<li>${new Date(d+'T12:00:00').toLocaleDateString('cs-CZ')} – ${TYPES[x.type]||x.type}${x.hours?' ('+x.hours+' h)':''}</li>`).join('')+'</ul>':'<p>Žádné.</p>'}</section>`;
}
function render(){
 if(!DB)return; const m=document.getElementById('month').value;
 const l=DB.employees?.lucie, z=DB.employees?.zdenka;
 const lr=l ? (l.days||[]).map(x=>['Ne','Po','Út','St','Čt','Pá','So'][x]).join(' + ')+' · '+(l.daily||6)+' h' : 'Út + Pá · 6 h';
 let zr='32 h týdně';
 if(z?.days?.length) zr=(z.days||[]).map(x=>['Ne','Po','Út','St','Čt','Pá','So'][x]).join(' + ')+' · '+(z.daily||'')+' h';
 document.getElementById('content').innerHTML=person('lucie','MUDr. Lucie Marschová',lr,m)+person('zdenka','Zdeňka Šmidrkalová',zr,m);
}
load().catch(e=>{document.getElementById('status').textContent='Data se nepodařilo načíst: '+e.message;document.getElementById('status').className='muted err';});
</script>
</body></html>
