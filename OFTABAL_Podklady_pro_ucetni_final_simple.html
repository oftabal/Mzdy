
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFTABAL – Podklady pro účetní</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;
  --brand:#1f5eff;--ok:#067647;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:18px}
h1{margin:0 0 4px;font-size:28px}
.subtitle{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(16,24,40,.04)}
.card h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #cfd4dc;border-radius:9px;font:inherit;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line)}
.total{font-size:18px;font-weight:800;border-top:2px solid var(--line);margin-top:5px;padding-top:10px}
.status{margin-top:12px;padding:12px;border-radius:10px;font-weight:800}
.ok{background:var(--okbg);color:var(--ok)}
.bad{background:var(--badbg);color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}
.primary{background:var(--brand);color:#fff}
.secondary{background:#eef2f6;color:#263238}
.output{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;line-height:1.5}
.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.grid,.two{grid-template-columns:1fr}}
@media print{
 body{background:white}.wrap{max-width:none;padding:0}.grid,.actions,.subtitle,h1{display:none}.output{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>OFTABAL – Podklady pro účetní</h1>
  <div class="subtitle">Jednoduchý měsíční přehled pro Zdeňku Šmidrkalovou a MUDr. Marschovou</div>

  <div class="card" style="margin-bottom:16px">
    <div class="two">
      <div>
        <label>Měsíc</label>
        <select id="month">
          <option>leden</option><option>únor</option><option>březen</option><option>duben</option>
          <option>květen</option><option>červen</option><option selected>červenec</option><option>srpen</option>
          <option>září</option><option>říjen</option><option>listopad</option><option>prosinec</option>
        </select>
      </div>
      <div>
        <label>Rok</label>
        <input id="year" type="number" value="2026">
      </div>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Zdeňka Šmidrkalová</h2>
      <label>Hrubá mzda HPP</label>
      <input id="z_hpp" type="number" value="27500">

      <div class="two">
        <div>
          <label>Dovolená (dny)</label>
          <input id="z_vac_days" type="number" value="0" step="0.5">
        </div>
        <div>
          <label>Sick days čerpáno</label>
          <input id="z_sick" type="number" value="0" min="0" max="3" step="0.5">
        </div>
      </div>

      <div class="two">
        <div>
          <label>DPP hodiny</label>
          <input id="z_hours" type="number" value="24" step="0.25">
        </div>
        <div>
          <label>Obrat pro provizi</label>
          <input id="z_turnover" type="number" value="150000">
        </div>
      </div>

      <div class="summary" id="z_summary"></div>
    </section>

    <section class="card">
      <h2>MUDr. Marschová</h2>
      <div class="two">
        <div>
          <label>Odpracované hodiny</label>
          <input id="m_hours" type="number" value="24" step="0.25">
        </div>
        <div>
          <label>Přesčasové hodiny</label>
          <input id="m_over" type="number" value="0" step="0.25">
        </div>
      </div>

      <div class="two">
        <div>
          <label>Obrat OCT</label>
          <input id="m_oct" type="number" value="0">
        </div>
        <div>
          <label>Počet operací pro bonus</label>
          <input id="m_ops" type="number" value="0">
        </div>
      </div>

      <div class="summary" id="m_summary"></div>
    </section>
  </div>

  <div class="actions">
    <button class="primary" onclick="generate()">Vytvořit podklady</button>
    <button class="secondary" onclick="window.print()">Tisk / PDF</button>
    <button class="secondary" onclick="copyText()">Kopírovat</button>
  </div>

  <div id="output" class="output"></div>
</div>

<script>
const FMT = new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:2});
const money = n => FMT.format(Math.round((n + Number.EPSILON)*100)/100) + " Kč";
const num = id => Number(document.getElementById(id).value) || 0;
const val = id => document.getElementById(id).value;

function calcZ(){
  const hpp=num('z_hpp'), vacDays=num('z_vac_days'), sick=num('z_sick');
  const hours=num('z_hours'), turnover=num('z_turnover');
  const hourly=hours*300, commission=turnover*0.03, total=hourly+commission;
  const limit=11990, excess=Math.max(0,total-limit);
  const vacHours=vacDays*8, vacRemain=Math.max(0,75-vacHours), sickRemain=Math.max(0,3-sick);
  return {hpp,vacDays,vacHours,vacRemain,sick,sickRemain,hours,turnover,hourly,commission,total,limit,excess};
}
function calcM(){
  const hours=num('m_hours'), over=num('m_over'), oct=num('m_oct'), ops=num('m_ops');
  const regular=hours*600, overtime=over*700, octBonus=oct*0.15, opBonus=ops*500;
  return {hours,over,oct,ops,regular,overtime,octBonus,opBonus,total:regular+overtime+octBonus+opBonus};
}
function update(){
  const z=calcZ(), m=calcM();
  document.getElementById('z_summary').innerHTML=`
    <div class="row"><span>Dovolená</span><strong>${z.vacDays} dne/dní (${z.vacHours} h)</strong></div>
    <div class="row"><span>Zbývá dovolené 2026</span><strong>${z.vacRemain} h</strong></div>
    <div class="row"><span>Sick days zbývá</span><strong>${z.sickRemain} / 3</strong></div>
    <div class="row"><span>DPP za hodiny</span><strong>${money(z.hourly)}</strong></div>
    <div class="row"><span>Provize 3 %</span><strong>${money(z.commission)}</strong></div>
    <div class="row total"><span>DPP celkem</span><strong>${money(z.total)}</strong></div>
    <div class="status ${z.excess>0?'bad':'ok'}">${z.excess>0?`Nad limitem o ${money(z.excess)}.`:'V limitu do 11 990 Kč.'}</div>`;
  document.getElementById('m_summary').innerHTML=`
    <div class="row"><span>Odměna za hodiny</span><strong>${money(m.regular)}</strong></div>
    <div class="row"><span>Přesčasy</span><strong>${money(m.overtime)}</strong></div>
    <div class="row"><span>Bonus OCT</span><strong>${money(m.octBonus)}</strong></div>
    <div class="row"><span>Bonus za operace</span><strong>${money(m.opBonus)}</strong></div>
    <div class="row total"><span>Celkem</span><strong>${money(m.total)}</strong></div>`;
  generate();
}
function generate(){
  const z=calcZ(), m=calcM();
  document.getElementById('output').textContent =
`OFTABAL s.r.o. – PODKLADY PRO ÚČETNÍ
Období: ${val('month')} ${val('year')}

ZDEŇKA ŠMIDRKALOVÁ

HPP
Hrubá mzda: ${money(z.hpp)}
Dovolená: ${z.vacDays} dne/dní (${z.vacHours} hodin)
Sick days: ${z.sick} dne/dní

DPP – optika
Odpracováno: ${z.hours} hodin
Odměna za hodiny: ${money(z.hourly)}
Obrat pro provizi: ${money(z.turnover)}
Provize 3 %: ${money(z.commission)}
DPP celkem: ${money(z.total)}
${z.excess>0 ? `Částka nad limitem 11 990 Kč: ${money(z.excess)}` : `DPP je v limitu 11 990 Kč.`}

MUDr. MARSCHOVÁ

Odpracované hodiny: ${m.hours}
Přesčasové hodiny: ${m.over}
Odměna za hodiny: ${money(m.regular)}
Odměna za přesčas: ${money(m.overtime)}
Bonus OCT: ${money(m.octBonus)}
Bonus za operace: ${money(m.opBonus)}
Celkem: ${money(m.total)}`;
}
async function copyText(){
  try{
    await navigator.clipboard.writeText(document.getElementById('output').textContent);
    alert('Podklady byly zkopírovány.');
  }catch(e){alert('Kopírování se nepodařilo. Označte text ručně.');}
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',update));
update();
</script>
</body>
</html>
