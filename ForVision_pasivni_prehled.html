<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ForVision – pasivní přehled</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef2f7; --card:#fff; --text:#0f172a; --muted:#64748b;
  --blue:#2563eb; --green:#059669; --red:#dc2626; --line:#e2e8f0;
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(180deg,#eaf0f7,#f8fafc);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)
}
.wrap{max-width:780px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.hero{background:#0f172a;color:#fff;border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(15,23,42,.18)}
.hero h1{font-size:24px;margin:0 0 5px}.hero p{margin:0;color:#cbd5e1;font-size:14px}
.status{margin-top:14px;border-radius:14px;padding:10px 12px;background:#334155;font-weight:800}
.status.ok{background:#d1fae5;color:#065f46}.status.error{background:#fee2e2;color:#991b1b}.status.loading{background:#dbeafe;color:#1e40af}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metric,.card{background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
.metric{padding:15px}.label{font-size:12px;color:var(--muted);font-weight:800}.value{font-size:25px;font-weight:900;margin-top:7px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.card{padding:14px;margin-top:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;border:0;border-radius:13px;padding:10px 13px;font-weight:800;background:var(--blue);color:#fff}
.small{font-size:12px;color:var(--muted)}
.calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calendar-head{margin-top:12px;color:var(--muted);font-size:11px;font-weight:800;text-align:center}
.day{min-height:69px;border:1px solid var(--line);border-radius:12px;padding:7px;background:#fff;cursor:pointer}
.day.empty{border-color:transparent;background:transparent;cursor:default}
.day.today{outline:2px solid var(--blue)}
.day.selected{background:#dbeafe;border-color:#93c5fd}
.num{font-weight:900;font-size:13px}.sum{font-size:11px;margin-top:8px;font-weight:800}.cnt{font-size:10px;color:var(--muted);margin-top:3px}
.list{margin-top:8px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.amount{font-size:18px;font-weight:900;white-space:nowrap}
.vs{font-weight:900}.note{margin-top:3px;color:#334155}.meta{font-size:12px;color:var(--muted);margin-top:4px}
.empty-msg{text-align:center;color:var(--muted);padding:22px}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .value{font-size:30px}
  .day{min-height:62px;padding:5px}
  .sum{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>ForVision OPTIKA</h1>
    <p>Pasivní přehled QR plateb · pouze čtení</p>
    <div id="status" class="status loading">Načítám data…</div>
  </section>

  <section class="grid">
    <div class="metric"><div class="label">DNES</div><div id="todaySum" class="value">—</div><div id="todayCount" class="sub">—</div></div>
    <div class="metric"><div class="label">TENTO TÝDEN</div><div id="weekSum" class="value">—</div><div id="weekCount" class="sub">—</div></div>
    <div class="metric"><div class="label">TENTO MĚSÍC</div><div id="monthSum" class="value">—</div><div id="monthCount" class="sub">—</div></div>
  </section>

  <section class="card">
    <div class="head">
      <div>
        <strong id="monthTitle">Kalendář měsíce</strong>
        <div id="updated" class="small">Zatím nenačteno</div>
      </div>
      <button id="refresh">Obnovit</button>
    </div>
    <div class="calendar-head"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div>
    <div id="calendar" class="calendar"></div>
  </section>

  <section class="card">
    <div class="head">
      <strong id="listTitle">Poslední platby</strong>
      <span id="listCount" class="small"></span>
    </div>
    <div id="list" class="list"><div class="empty-msg">Čekám na data…</div></div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://evubrhoqferaqupdklbs.supabase.co";
const SUPABASE_KEY = "sb_publishable_NRL6EeQcdHrAJ5LWk_5m9g_wohEO4DD";
const TABLE = "forvision_qr";
const $ = id => document.getElementById(id);
const state = { records: [], selectedDate: null };

const money = n => new Intl.NumberFormat("cs-CZ",{
  style:"currency",currency:"CZK",maximumFractionDigits:0
}).format(Number(n||0));

const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function parseDate(v){
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? null : d;
}
function localKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function sameDay(a,b){return localKey(a)===localKey(b)}
function startOfWeek(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x;
}
function formatDateTime(v){
  const d=parseDate(v); if(!d) return "—";
  return d.toLocaleString("cs-CZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function setStatus(text,cls){
  const el=$("status"); el.textContent=text; el.className="status "+cls;
}

function validRecords(){
  return state.records.filter(r=>parseDate(r.date));
}
function sum(rows){return rows.reduce((s,r)=>s+(Number(r.amount)||0),0)}

function renderMetrics(){
  const now=new Date(), weekStart=startOfWeek(now), weekEnd=new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate()+7);
  const rows=validRecords();
  const today=rows.filter(r=>sameDay(parseDate(r.date),now));
  const week=rows.filter(r=>{const d=parseDate(r.date); return d>=weekStart&&d<weekEnd});
  const month=rows.filter(r=>{const d=parseDate(r.date); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});
  $("todaySum").textContent=money(sum(today)); $("todayCount").textContent=today.length+" plateb";
  $("weekSum").textContent=money(sum(week)); $("weekCount").textContent=week.length+" plateb";
  $("monthSum").textContent=money(sum(month)); $("monthCount").textContent=month.length+" plateb";
}

function renderCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  $("monthTitle").textContent=now.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"});
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const offset=(first.getDay()+6)%7;
  const byDay={};
  validRecords().forEach(r=>{
    const d=parseDate(r.date);
    if(d.getFullYear()===y&&d.getMonth()===m){
      const k=localKey(d);
      if(!byDay[k]) byDay[k]=[];
      byDay[k].push(r);
    }
  });
  let html="";
  for(let i=0;i<offset;i++) html+='<div class="day empty"></div>';
  for(let n=1;n<=days;n++){
    const d=new Date(y,m,n), k=localKey(d), rows=byDay[k]||[];
    const cls=["day",sameDay(d,now)?"today":"",state.selectedDate===k?"selected":""].join(" ");
    html+=`<div class="${cls}" data-date="${k}">
      <div class="num">${n}</div>
      <div class="sum">${rows.length?money(sum(rows)):"—"}</div>
      <div class="cnt">${rows.length?rows.length+" pl.":""}</div>
    </div>`;
  }
  $("calendar").innerHTML=html;
  document.querySelectorAll(".day[data-date]").forEach(el=>{
    el.onclick=()=>{state.selectedDate=state.selectedDate===el.dataset.date?null:el.dataset.date;renderCalendar();renderList()};
  });
}

function renderList(){
  let rows=validRecords().sort((a,b)=>parseDate(b.date)-parseDate(a.date));
  if(state.selectedDate){
    rows=rows.filter(r=>localKey(parseDate(r.date))===state.selectedDate);
    const d=new Date(state.selectedDate+"T12:00:00");
    $("listTitle").textContent="Platby "+d.toLocaleDateString("cs-CZ");
  }else{
    rows=rows.slice(0,20);
    $("listTitle").textContent="Poslední platby";
  }
  $("listCount").textContent=rows.length+" záznamů";
  $("list").innerHTML=rows.length?rows.map(r=>`
    <div class="item">
      <div class="row">
        <div>
          <div class="vs">VS ${esc(r.vs||"—")}</div>
          <div class="note">${esc(r.note||"Bez poznámky")}</div>
        </div>
        <div class="amount">${money(r.amount)}</div>
      </div>
      <div class="meta">${esc(r.type||"")} · ${formatDateTime(r.date)}</div>
    </div>`).join(""):'<div class="empty-msg">V tento den nejsou žádné platby.</div>';
}

async function load(){
  setStatus("Načítám data…","loading");
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const url=SUPABASE_URL+"/rest/v1/"+TABLE+"?select=id,vs,amount,type,note,date&order=date.desc";
    const res=await fetch(url,{
      method:"GET",cache:"no-store",signal:controller.signal,
      headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,Accept:"application/json"}
    });
    const text=await res.text();
    if(!res.ok) throw new Error("HTTP "+res.status+" · "+text.slice(0,120));
    const data=JSON.parse(text);
    if(!Array.isArray(data)) throw new Error("Neplatná odpověď serveru");
    state.records=data;
    renderMetrics(); renderCalendar(); renderList();
    setStatus("Online · data načtena","ok");
    $("updated").textContent="Aktualizováno "+new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})+" · celkem "+data.length+" záznamů";
  }catch(e){
    setStatus("Načtení selhalo: "+(e.name==="AbortError"?"časový limit":e.message),"error");
    $("list").innerHTML='<div class="empty-msg">Data se nepodařilo načíst.</div>';
  }finally{clearTimeout(timer)}
}

$("refresh").onclick=load;
load();
setInterval(load,30000);
</script>
</body>
</html>
